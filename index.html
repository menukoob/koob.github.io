
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#F1F5E7">
<title>KOOB | كوب</title>

<style>
:root{
  --bg:#F1F5E7;
  --cream:#E2EACD;
  --white:#FCFDF8;
  --brown:#52633D;
  --dark:#35452A;
  --gold:#82995A;
  --muted:#899477;
  --border:#DCE5C9;
  --shadow:0 12px 35px #52633D12;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Cairo',sans-serif;
  background:var(--bg);
  color:var(--brown);
  overflow-x:hidden;
}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block;width:100%;object-fit:cover}
button:active{transform:scale(.96)}

/* INTRO */
.intro{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;
  background:#35452A;
  transition:opacity 1s,visibility 1s;
}
.intro.hide{opacity:0;visibility:hidden}
.intro-bg{
  position:absolute;inset:-5%;
  background:url('assets/intro.png') center/cover;
  animation:zoom 12s infinite alternate;
}
.intro:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,#24321DBF,#24321D40);
}
.intro-content{position:relative;z-index:2;color:#F1F5E7;padding:20px}
.intro-content .tiny{letter-spacing:5px;font-size:10px;animation:up 1s .3s both}
.intro-content h1{font-size:85px;margin:15px 0;animation:logo 1.5s both}
.intro-content p{font-size:14px;animation:up 1s 1s both}
.intro-enter{
  margin-top:35px;padding:13px 36px;
  border:1px solid #A8BD7C;background:transparent;
  color:#F1F5E7;font-size:13px;
  transition:.4s;animation:up 1s 1.5s both;
}
.intro-enter:hover{background:#A8BD7C;color:#35452A}

/* NAV */
header{
  height:78px;padding:0 7%;
  display:flex;align-items:center;justify-content:space-between;
  background:#F1F5E7eF;
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(15px);
}
.logo{font-size:28px;font-weight:800;letter-spacing:3px}
.logo span{color:var(--gold)}
.nav-links{display:flex;gap:32px;font-size:13px}
.nav-links a{transition:.3s}
.nav-links a:hover{color:var(--gold)}
.cart-count{
  background:#fff;color:var(--brown);
  border-radius:50%;width:21px;height:21px;
  display:grid;place-items:center;font-size:11px;
}

/* HERO */
.hero{
  min-height:570px;
  margin:24px 4%;
  border-radius:8px;
  position:relative;overflow:hidden;
  display:flex;align-items:center;
  background:#35452A;
}
.hero-bg{
  position:absolute;inset:0;
  background:
  linear-gradient(90deg,#24321D08,#24321DD9),
  url('assets/intro.png') center/cover;
  animation:zoom 20s infinite alternate;
}
.hero-content{
  position:relative;color:#F4F7E9;
  padding:65px 9%;max-width:650px;
  animation:up 1.2s both;
}
.hero-label{font-size:11px;letter-spacing:4px;color:#DCE8BD}
.hero h2{font-size:clamp(42px,7vw,75px);line-height:1.5;margin:15px 0}
.hero h2 span{color:#B9CC91}
.hero p{font-size:14px;line-height:2;color:#E3EBD5;max-width:400px}
.primary-btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:#B9CC91;color:#35452A;
  padding:13px 30px;margin-top:25px;
  border:0;border-radius:3px;font-weight:700;
  transition:.35s;font-size:13px;
}
.primary-btn:hover{background:#F1F5E7;transform:translateY(-4px)}

/* GENERAL */
.section{padding:75px 7%}
.section-head{text-align:center;margin-bottom:35px}
.section-head small{color:var(--gold);letter-spacing:3px;font-size:11px}
.section-head h2{font-size:32px;margin:8px 0}
.section-head p{color:var(--muted);font-size:12px}

/* CATEGORY */
.categories{
  display:flex;justify-content:center;gap:12px;
  flex-wrap:wrap;margin-bottom:35px;
}
.category{
  background:transparent;border:1px solid #C8D6AD;
  padding:9px 22px;border-radius:30px;
  color:var(--brown);font-size:12px;
  transition:.3s;
}
.category.active,.category:hover{
  background:var(--brown);color:white;border-color:var(--brown);
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
}
.product{
  background:var(--white);
  border:1px solid #DCE5C9;
  border-radius:7px;overflow:hidden;
  transition:.4s;
  box-shadow:var(--shadow);
}
.product:hover{transform:translateY(-7px);box-shadow:0 18px 35px #52633D18}
.product-image{height:220px;position:relative;overflow:hidden}
.product-image img{height:100%;transition:.7s}
.product:hover img{transform:scale(1.07)}
.product-info{padding:18px}
.product-info h3{font-size:16px}
.product-info p{font-size:11px;color:var(--muted);margin:7px 0 15px}
.product-bottom{display:flex;justify-content:space-between;align-items:center}
.price{font-size:14px;font-weight:800;color:var(--gold)}
.add-btn{
  width:38px;height:38px;border:0;border-radius:50%;
  background:var(--cream);color:var(--brown);
  font-size:22px;transition:.3s;
}
.add-btn:hover{background:var(--brown);color:white;transform:rotate(90deg)}

/* STORY */
.story{
  background:#E5ECD5;
  display:grid;grid-template-columns:1fr 1fr;
  align-items:center;gap:50px;
}
.story img{height:350px;border-radius:5px}
.story h2{font-size:36px;margin:15px 0}
.story p{font-size:13px;line-height:2.5;color:#788666}

/* FOOTER */
footer{
  background:#35452A;color:#E7EED8;
  text-align:center;padding:40px 15px;
}
footer .logo{margin-bottom:10px}
footer p{font-size:11px;color:#B6C39B}

/* CART DRAWER */
.overlay{
  position:fixed;inset:0;background:#24321D80;
  z-index:100;opacity:0;visibility:hidden;transition:.35s;
}
.overlay.show{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;bottom:0;left:0;
  width:min(430px,92%);
  background:var(--white);z-index:101;
  padding:25px;transform:translateX(-110%);
  transition:.45s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--border)}
.drawer-head h3{font-size:21px}
.close{
  border:0;background:#E7EED8;
  width:35px;height:35px;border-radius:50%;
  color:var(--brown);font-size:20px;
}
.cart-items{flex:1;overflow:auto;padding:15px 0}
.empty{text-align:center;color:var(--muted);padding:70px 10px;font-size:13px}
.cart-item{
  display:flex;gap:12px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--border);
}
.cart-item img{width:75px;height:75px;border-radius:5px}
.cart-item-info{flex:1}
.cart-item-info h4{font-size:13px}
.cart-item-info p{font-size:12px;color:var(--gold);margin-top:5px}
.quantity{display:flex;align-items:center;gap:10px;margin-top:8px}
.quantity button{
  width:25px;height:25px;border:0;
  border-radius:50%;background:#E2EACD;color:var(--brown);
}
.remove{border:0;background:none;color:#82995A;font-size:11px}
.cart-total{border-top:1px solid var(--border);padding-top:18px}
.total-line{display:flex;justify-content:space-between;font-weight:700}
.checkout-btn{
  width:100%;border:0;background:var(--brown);
  color:white;padding:14px;margin-top:17px;
  border-radius:4px;transition:.3s;
}
.checkout-btn:hover{background:var(--gold)}

/* CHECKOUT MODAL */
.modal{
  position:fixed;inset:0;z-index:150;
  display:grid;place-items:center;
  padding:15px;background:#24321D80;
  opacity:0;visibility:hidden;transition:.3s;
}
.modal.show{opacity:1;visibility:visible}
.modal-box{
  background:var(--white);padding:25px;
  width:min(450px,100%);max-height:90vh;overflow:auto;
  border-radius:8px;transform:translateY(25px);
  transition:.35s;
}
.modal.show .modal-box{transform:translateY(0)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-head h3{font-size:21px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;margin-bottom:7px;color:#687653}
.field input,.field textarea{
  width:100%;padding:13px;
  border:1px solid var(--border);outline:none;
  background:#F6F8EF;color:var(--brown);
  border-radius:4px;font-size:13px;
}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:75px}
.send-btn{
  width:100%;padding:14px;border:0;
  background:var(--brown);color:white;
  border-radius:4px;font-size:14px;
}
.send-btn:hover{background:var(--gold)}
.toast{
  position:fixed;bottom:25px;left:50%;
  transform:translate(-50%,20px);
  background:var(--brown);color:white;
  padding:12px 22px;border-radius:30px;
  font-size:12px;z-index:300;
  opacity:0;pointer-events:none;transition:.3s;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.reveal{opacity:0;transform:translateY(25px);transition:.8s}
.reveal.active{opacity:1;transform:translateY(0)}

@keyframes zoom{to{transform:scale(1.1)}}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes logo{from{opacity:0;filter:blur(10px);transform:scale(.8)}to{opacity:1;filter:blur(0);transform:scale(1)}}

@media(max-width:750px){
  header{height:68px;padding:0 5%}
  .nav-links{gap:13px;font-size:10px}
  .logo{font-size:23px}
  .hero{margin:12px 3%;min-height:540px}
  .hero-bg{background-position:60% center}
  .hero-content{padding:35px 7%}
  .section{padding:60px 5%}
  .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .product-image{height:150px}
  .product-info{padding:12px}
  .product-info h3{font-size:13px}
  .product-info p{font-size:10px}
  .price{font-size:12px}
  .add-btn{width:32px;height:32px}
  .story{grid-template-columns:1fr;gap:25px}
  .story img{height:240px}
  .story h2{font-size:29px}
  .intro-content h1{font-size:70px}
}
@media(max-width:380px){
  .nav-links{gap:8px}
  .nav-links a{font-size:9px}
}

/* MODERN LUXURY BUTTON SYSTEM */
button,.primary-btn{
  border-radius:999px !important;
  transition:
    background .35s ease,
    color .35s ease,
    transform .35s cubic-bezier(.2,.8,.2,1),
    box-shadow .35s ease,
    border-color .35s ease !important;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible,a:focus-visible{
  outline:2px solid #82995A;
  outline-offset:4px;
}

.intro-enter{
  border-radius:50px !important;
  padding:15px 38px !important;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(12px);
  box-shadow:0 8px 30px #0002;
}

.intro-enter:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 35px #82995A40;
}

.primary-btn{
  border-radius:50px !important;
  box-shadow:0 7px 20px #52633D18;
}

.primary-btn:hover{
  box-shadow:0 12px 25px #52633D25;
}

.category{
  border-radius:50px !important;
  padding:11px 23px !important;
  background:rgba(255,255,255,.45);
  border-color:#dfd2c1;
  font-weight:600;
}

.category.active{
  background:#52633D;
  box-shadow:0 6px 18px #52633D25;
}

.add-btn{
  border-radius:50% !important;
  width:42px !important;
  height:42px !important;
  display:grid;
  place-items:center;
  font-size:24px;
  box-shadow:0 4px 12px #52633D12;
}

.add-btn:hover{
  transform:rotate(90deg) scale(1.08);
  box-shadow:0 7px 18px #52633D25;
}

.checkout-btn,.send-btn{
  border-radius:50px !important;
  padding:15px 20px !important;
  font-weight:700;
  box-shadow:0 7px 20px #52633D20;
}

.checkout-btn:hover,.send-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 25px #52633D30;
}

.close{
  border-radius:50% !important;
  width:40px;
  height:40px;
  font-size:23px;
  transition:.3s;
}

.close:hover{
  background:#52633D;
  color:white;
  transform:rotate(90deg);
}

.quantity button{
  border-radius:50% !important;
  width:30px;
  height:30px;
  font-size:17px;
  transition:.25s;
}

.quantity button:hover{
  background:#52633D;
  color:white;
}

.remove{
  width:auto !important;
  border-radius:30px !important;
  padding:5px 12px;
}

.field input,.field textarea{
  border-radius:15px !important;
  padding:15px !important;
  transition:.3s;
  background:#F6F8EF;
}

.field input:focus,.field textarea:focus{
  background:white;
  box-shadow:0 0 0 4px #82995A18;
}

.product{
  border-radius:16px;
  transition:transform .4s ease,box-shadow .4s ease;
}

.product-image{
  border-radius:14px 14px 0 0;
}

.drawer{
  border-radius:0 22px 22px 0;
}

.modal-box{
  border-radius:22px !important;
  box-shadow:0 25px 80px #21160b25;
}

.cart-button:active,.category:active,
.primary-btn:active,.checkout-btn:active,
.send-btn:active,.intro-enter:active{
  transform:scale(.96);
}

@media(max-width:750px){
  .category{padding:9px 17px !important}
  .add-btn{width:38px !important;height:38px !important}
  .drawer{border-radius:0 20px 20px 0}
}


/* KOOB INSTAGRAM */
.instagram-button {
  display:inline-flex;

}
.instagram-footer:hover {

}
.product-bottom {

let activeCategory = "الكل";

const money = n => n.toLocaleString("en-US") + " د.ع";

function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.classList.remove("show"),2400);
}

function enterSite(){
  document.getElementById("intro").classList.add("hide");
  document.body.style.overflow="auto";
  setTimeout(()=>document.getElementById("intro").remove(),1100);
  revealItems();
}

function renderProducts(){
  const area=document.getElementById("products");
  const filtered=productsData.filter(p=>activeCategory==="الكل"||p.cat===activeCategory);
  area.innerHTML=filtered.map(p=>`
    <article class="product reveal">
      <div class="product-image">
        ${p.img ? `${p.img ? `<img src="${p.img}" alt="${p.name}" loading="lazy">` : '<div class="no-product-image">KOOB</div>'}` : '<div class="no-product-image">KOOB</div>'}
      </div>
      <div class="product-info">
        <h3>${p.name}</h3>
        <p>${p.desc || ""}</p>
        <div class="product-bottom">
          <span class="price">${money(p.price)}</span>
          
        </div>
      </div>
    </article>
  `).join("");
  revealItems();
}

document.getElementById("categories").addEventListener("click",e=>{
  const btn=e.target.closest(".category");
  if(!btn)return;
  document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  activeCategory=btn.dataset.category;
  renderProducts();
});

function revealItems(){
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("active");
        observer.unobserve(entry.target);
      }
    });
  },{threshold:.08});
  document.querySelectorAll(".reveal:not(.active)").forEach(el=>observer.observe(el));
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
  }
});

renderProducts();
</script>
